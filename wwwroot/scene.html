<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Viewer</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        <h2 id="hunterName">Loading...</h2>
        <p id="status">Initializing 3D viewer...</p>
    </div>
    <div id="error">
        <h2>Model not found</h2>
        <p id="errorMessage"></p>
    </div>

    <div id="topActions" style="display:none;">
        <button id="modeToggleBtn">Switch to Editor</button>
        <button id="exportBtn" title="Download viewer_settings.json">Export</button>
        <button id="importBtn" title="Replace settings from a JSON file">Import</button>
        <input id="importFile" type="file" accept="application/json,.json" style="display:none">
    </div>
    <div id="editorPanel" style="display:none;"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
